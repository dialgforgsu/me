name: Update Calendar & Videos

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run calendar updater
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: node update-calendar.js

      # A YouTube hiccup shouldn't block the calendar commit.
      - name: Run Hot Pot video updater
        continue-on-error: true
        run: node update-videos.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json calendar.md hotpot.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update calendar/video cache" && git push)
